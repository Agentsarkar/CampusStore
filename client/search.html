<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Products - Campus Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-6">
        
        <!-- Search Info -->
        <div class="mb-6">
            <h2 class="text-xl font-bold text-gray-800" id="search-title">Search Results</h2>
            <p class="text-gray-400 text-sm mt-1" id="search-count">Searching for matching campus store items...</p>
        </div>

        <!-- Products Grid -->
        <div id="search-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
            <!-- Loading Skeleton -->
            <div class="h-48 bg-white border border-gray-100 rounded-lg animate-pulse"></div>
            <div class="h-48 bg-white border border-gray-100 rounded-lg animate-pulse"></div>
        </div>

        <!-- No Data UI -->
        <div id="no-data-ui" class="hidden flex flex-col items-center justify-center py-16 text-gray-400">
            <i class="fa-solid fa-magnifying-glass-minus text-6xl mb-4"></i>
            <p class="text-lg font-semibold">No results found</p>
            <p class="text-sm mt-1">Try searching for other snacks, drinks, or notebook supplies.</p>
        </div>

    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get("q");

        // Page load
        document.addEventListener("DOMContentLoaded", () => {
            if (query) {
                document.getElementById("search-title").innerText = `Search Results for "${query}"`;
                performSearch();
            } else {
                document.getElementById("search-title").innerText = "All Products";
                performSearch("");
            }
        });

        async function performSearch() {
            const grid = document.getElementById("search-grid");
            const noData = document.getElementById("no-data-ui");
            const countText = document.getElementById("search-count");

            const res = await apiFetch("/api/product/search-product", {
                method: "POST",
                body: { search: query || "", page: 1, limit: 20 }
            });

            if (res.success && res.data && res.data.length > 0) {
                grid.classList.remove("hidden");
                noData.classList.add("hidden");
                grid.innerHTML = "";
                
                res.data.forEach(product => {
                    grid.innerHTML += window.renderProductCardHtml(product);
                });
                
                countText.innerText = `Found ${res.data.length} items matching your query.`;
            } else {
                grid.classList.add("hidden");
                noData.classList.remove("hidden");
                countText.innerText = "0 items found.";
            }
        }

        // Cart Sync
        window.addEventListener("cartUpdated", () => {
            performSearch();
        });
    </script>
</body>
</html>
