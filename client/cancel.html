<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Cancelled - Campus Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header Container -->
    <div id="header-container"></div>

    <main class="flex-grow flex items-center justify-center py-16 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 text-center space-y-6">
            
            <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto shadow-inner animate-pulse">
                <i class="fa-solid fa-circle-xmark text-5xl"></i>
            </div>

            <div>
                <h1 class="text-2xl font-black text-gray-800 tracking-tight">Order Cancelled</h1>
                <p class="text-gray-400 text-sm mt-2">
                    Your checkout transaction was not completed. If you faced issues, you can choose Pay on Delivery during checkout.
                </p>
            </div>

            <div class="pt-4">
                <a href="checkout.html" class="block w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 px-4 rounded-lg shadow-sm transition text-sm">
                    Return to Checkout
                </a>
            </div>

        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
