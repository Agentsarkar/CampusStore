<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Campus Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Container -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 transition duration-300">
            <div class="text-center mb-8">
                <span class="text-3xl font-black text-green-600 tracking-tight">CAMPUS<span class="text-yellow-500 font-bold">STORE</span></span>
                <h2 id="page-title" class="text-xl font-bold text-gray-800 mt-4">Forgot Password</h2>
                <p id="page-subtitle" class="text-gray-400 text-sm mt-1">Enter your registered email to receive a 6-digit verification code</p>
            </div>

            <!-- STEP 1: Email Request Form -->
            <form id="step-email-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john.doe@campus.edu" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-green-600 text-sm bg-gray-50 focus:bg-white transition duration-200">
                </div>

                <button type="submit" id="send-otp-btn" 
                    class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2">
                    Send Verification Code
                </button>
            </form>

            <!-- STEP 2: OTP Verification Form (hidden by default) -->
            <form id="step-otp-form" class="space-y-5 hidden">
                <div class="bg-green-50 border border-green-200 rounded-lg p-3 text-xs text-green-800 flex items-center justify-between">
                    <span>Code sent to: <strong id="target-email-span"></strong></span>
                    <button type="button" id="change-email-btn" class="text-green-700 font-bold hover:underline">Change</button>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="otp-code">6-Digit Verification Code</label>
                    <input type="text" id="otp-code" maxlength="6" pattern="[0-9]{6}" required placeholder="123456" 
                        class="w-full px-4 py-3 text-center tracking-widest text-2xl font-bold rounded-lg border border-gray-200 focus:outline-none focus:border-green-600 bg-gray-50 focus:bg-white transition duration-200">
                </div>

                <button type="submit" id="verify-otp-btn" 
                    class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2">
                    Verify Code & Continue
                </button>

                <div class="text-center text-sm text-gray-500 pt-2">
                    <span id="timer-text">Resend code in <strong id="countdown">60</strong>s</span>
                    <button type="button" id="resend-btn" class="hidden text-green-600 hover:text-green-700 font-bold hover:underline">Resend Code</button>
                </div>
            </form>

            <div class="text-center mt-6 pt-6 border-t border-gray-100 text-sm text-gray-500">
                Remember your password? 
                <a href="login.html" class="text-green-600 hover:text-green-700 font-bold">Log in here</a>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        let currentEmail = "";
        let timerInterval = null;

        function startResendTimer() {
            let seconds = 60;
            const timerText = document.getElementById("timer-text");
            const countdownSpan = document.getElementById("countdown");
            const resendBtn = document.getElementById("resend-btn");

            timerText.classList.remove("hidden");
            resendBtn.classList.add("hidden");
            countdownSpan.innerText = seconds;

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                seconds--;
                countdownSpan.innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    timerText.classList.add("hidden");
                    resendBtn.classList.remove("hidden");
                }
            }, 1000);
        }

        // STEP 1: Request OTP
        document.getElementById("step-email-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const email = document.getElementById("email").value.trim();
            const sendBtn = document.getElementById("send-otp-btn");

            sendBtn.disabled = true;
            sendBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Sending OTP...`;

            const res = await apiFetch("/api/user/forgot-password", {
                method: "POST",
                body: { email }
            });

            if (res.success) {
                currentEmail = email;
                window.toast.success(res.message || "OTP code sent to your email!");
                
                // Transition to Step 2
                document.getElementById("step-email-form").classList.add("hidden");
                document.getElementById("step-otp-form").classList.remove("hidden");
                document.getElementById("target-email-span").innerText = email;
                document.getElementById("page-title").innerText = "Enter Verification Code";
                document.getElementById("page-subtitle").innerText = "Check your email inbox for the 6-digit OTP code";
                
                startResendTimer();
            } else {
                window.toast.error(res.message || "Email not registered");
                sendBtn.disabled = false;
                sendBtn.innerHTML = "Send Verification Code";
            }
        });

        // STEP 2: Verify OTP
        document.getElementById("step-otp-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const otp = document.getElementById("otp-code").value.trim();
            const verifyBtn = document.getElementById("verify-otp-btn");

            if (otp.length !== 6) {
                window.toast.error("Please enter a valid 6-digit OTP code");
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Verifying...`;

            const res = await apiFetch("/api/user/verify-otp", {
                method: "POST",
                body: { email: currentEmail, otp }
            });

            if (res.success && res.data && res.data.resetToken) {
                window.toast.success("OTP verified successfully!");
                sessionStorage.setItem("resetToken", res.data.resetToken);
                sessionStorage.setItem("resetEmail", currentEmail);
                
                setTimeout(() => {
                    window.location.href = "reset-password.html";
                }, 1000);
            } else {
                window.toast.error(res.message || "Invalid or expired OTP");
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = "Verify Code & Continue";
            }
        });

        // Resend OTP button
        document.getElementById("resend-btn").addEventListener("click", async () => {
            const resendBtn = document.getElementById("resend-btn");
            resendBtn.innerText = "Sending...";
            
            const res = await apiFetch("/api/user/forgot-password", {
                method: "POST",
                body: { email: currentEmail }
            });

            if (res.success) {
                window.toast.success("A new OTP code has been sent!");
                startResendTimer();
            } else {
                window.toast.error(res.message || "Failed to resend OTP");
                resendBtn.innerText = "Resend Code";
            }
        });

        // Change Email button
        document.getElementById("change-email-btn").addEventListener("click", () => {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById("step-otp-form").classList.add("hidden");
            document.getElementById("step-email-form").classList.remove("hidden");
            document.getElementById("page-title").innerText = "Forgot Password";
            document.getElementById("page-subtitle").innerText = "Enter your registered email to receive a 6-digit verification code";
            document.getElementById("send-otp-btn").disabled = false;
            document.getElementById("send-otp-btn").innerHTML = "Send Verification Code";
        });
    </script>
</body>
</html>
