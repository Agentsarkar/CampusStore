<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Campus Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Container -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 transition duration-300">
            <div class="text-center mb-8">
                <span class="text-3xl font-black text-green-600 tracking-tight">CAMPUS<span class="text-yellow-500 font-bold">STORE</span></span>
                <h2 class="text-xl font-bold text-gray-800 mt-4">Set New Password</h2>
                <p class="text-gray-400 text-sm mt-1" id="email-heading">Enter a strong new password for your account</p>
            </div>

            <!-- Reset Form -->
            <form id="reset-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="new-password">New Password</label>
                    <input type="password" id="new-password" required placeholder="At least 6 characters" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-green-600 text-sm bg-gray-50 focus:bg-white transition duration-200">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required placeholder="••••••••" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-green-600 text-sm bg-gray-50 focus:bg-white transition duration-200">
                </div>

                <button type="submit" id="submit-btn" 
                    class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2">
                    Reset Password
                </button>
            </form>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        const resetToken = sessionStorage.getItem("resetToken");
        const resetEmail = sessionStorage.getItem("resetEmail");
        const urlParams = new URLSearchParams(window.location.search);
        const urlEmail = urlParams.get("email");

        const displayEmail = resetEmail || urlEmail;

        if (!resetToken && !urlEmail) {
            window.toast.error("Unauthorized access. Please request an OTP code first.");
            setTimeout(() => {
                window.location.href = "forgot-password.html";
            }, 1500);
        } else if (displayEmail) {
            document.getElementById("email-heading").innerText = `Set a new password for: ${displayEmail}`;
        }

        document.getElementById("reset-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById("new-password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            const submitBtn = document.getElementById("submit-btn");

            if (newPassword.length < 6) {
                window.toast.error("Password must be at least 6 characters");
                return;
            }

            if (newPassword !== confirmPassword) {
                window.toast.error("Passwords do not match");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Resetting Password...`;

            const payload = resetToken 
                ? { resetToken, newPassword } 
                : { email: urlEmail, newPassword };

            const res = await apiFetch("/api/user/reset-password", {
                method: "POST",
                body: payload
            });

            if (res.success) {
                sessionStorage.removeItem("resetToken");
                sessionStorage.removeItem("resetEmail");
                window.toast.success(res.message || "Password reset successfully!");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);
            } else {
                window.toast.error(res.message || "Failed to reset password");
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Reset Password";
            }
        });
    </script>
</body>
</html>
