<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Registration Card Container -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 transition duration-300">
            <div class="text-center mb-8">
                <span class="text-3xl font-black text-green-600 tracking-tight">CAMPUS<span class="text-yellow-500 font-bold">STORE</span></span>
                <h2 class="text-xl font-bold text-gray-800 mt-4">Create Account</h2>
                <p class="text-gray-400 text-sm mt-1">Get snacks & stationeries delivered in minutes</p>
            </div>

            <!-- Register Form -->
            <form id="register-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-green-600 text-sm bg-gray-50 focus:bg-white transition duration-200">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john.doe@campus.edu" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-green-600 text-sm bg-gray-50 focus:bg-white transition duration-200">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="password">Password</label>
                    <input type="password" id="password" required placeholder="At least 6 characters" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-green-600 text-sm bg-gray-50 focus:bg-white transition duration-200">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required placeholder="••••••••" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-green-600 text-sm bg-gray-50 focus:bg-white transition duration-200">
                </div>

                <button type="submit" id="submit-btn" 
                    class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-6 pt-6 border-t border-gray-100 text-sm text-gray-500">
                Already have an account? 
                <a href="login.html" class="text-green-600 hover:text-green-700 font-bold">Log in here</a>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            const submitBtn = document.getElementById("submit-btn");

            if (password.length < 6) {
                window.toast.error("Password must be at least 6 characters");
                return;
            }

            if (password !== confirmPassword) {
                window.toast.error("Passwords do not match");
                return;
            }

            // Disable button during load
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Creating Account...`;

            const res = await apiFetch("/api/user/register", {
                method: "POST",
                body: { name, email, password }
            });

            if (res.success) {
                window.toast.success("Registration Successful!");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);
            } else {
                window.toast.error(res.message || "Registration failed");
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Create Account";
            }
        });
    </script>
</body>
</html>
