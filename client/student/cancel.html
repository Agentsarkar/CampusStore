<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Cancelled - Campus Commerce</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Design System CSS -->
    <link rel="stylesheet" href="../shared/css/design-system.css">
</head>
<body class="bg-[#faf9f6] dark:bg-[#0b0f17] text-slate-900 dark:text-slate-100 flex flex-col min-h-screen">

    <!-- Header Container -->
    <div id="header-container"></div>

    <main class="flex-grow max-w-md w-full mx-auto px-4 py-12 flex flex-col items-center justify-center text-center">
        <div class="campus-card p-6 w-full space-y-4">
            <div class="w-12 h-12 rounded-full bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400 flex items-center justify-center mx-auto text-xl font-bold">
                <i class="fa-solid fa-xmark"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-slate-900 dark:text-white">Order Cancelled</h1>
                <p class="text-xs text-slate-500 mt-1">Your checkout session was cancelled or timed out.</p>
            </div>
            <div class="flex flex-col gap-2 pt-2">
                <a href="checkout.html" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md text-xs transition">
                    Return to Checkout
                </a>
                <a href="index.html" class="w-full bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold py-2 px-4 rounded-md text-xs transition">
                    Return to Portal Home
                </a>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Application Scripts -->
    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/api.js"></script>
    <script src="../shared/js/toast.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
