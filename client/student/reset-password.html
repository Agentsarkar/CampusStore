<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — CampusStore</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Design System CSS -->
    <link rel="stylesheet" href="../shared/css/design-system.css">
</head>
<body class="bg-[#FAF9F3] text-[#111713] flex flex-col min-h-screen">

    <!-- Header Navigation -->
    <header class="py-4 px-6 max-w-6xl mx-auto w-full flex items-center justify-between">
        <a href="index.html" class="font-extrabold text-lg tracking-tight text-[#111713]">
            Campus<span class="text-[#004D2B]">Store</span>
        </a>
        <a href="index.html" class="text-xs font-bold text-[#004D2B] hover:underline">
            &larr; Back to Store
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 md:p-8">
        <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-12 overflow-hidden shadow-xl border border-[#E8E7DF] rounded-3xl bg-white min-h-[500px]">
            
            <!-- Left Hero Section (Deep Forest Green, Aesthetic Minimal Typographic Highlights) -->
            <div class="md:col-span-5 bg-[#004D2B] text-white p-8 sm:p-10 flex flex-col justify-between relative overflow-hidden">
                <!-- Top Brand info -->
                <div class="space-y-6 relative z-10">
                    <span class="inline-block bg-[#D7F000] text-[#111713] text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">
                        FINAL STEP
                    </span>
                    
                    <div class="space-y-2">
                        <h2 class="text-2xl sm:text-3xl font-extrabold leading-tight text-white">
                            Set New Password
                        </h2>
                        <p class="text-xs text-[#E6F0EB] font-normal leading-relaxed pt-1">
                            Enter the verification OTP code sent to your campus email and specify a new password.
                        </p>
                    </div>
                </div>

                <!-- Aesthetic Minimal Bullet Highlights -->
                <div class="space-y-3 pt-6 relative z-10 border-t border-white/10 mt-6 text-xs text-[#E6F0EB]">
                    <div class="flex items-center gap-2.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#D7F000] flex-shrink-0"></span>
                        <span class="font-semibold text-white">Update Account Credentials</span>
                    </div>
                </div>
            </div>

            <!-- Right Form Section -->
            <div class="md:col-span-7 bg-white p-8 sm:p-10 flex flex-col justify-between space-y-6">
                
                <div class="space-y-4">
                    <div>
                        <h1 class="text-xl sm:text-2xl font-extrabold text-[#111713]">New Password</h1>
                        <p class="text-xs text-[#526056] mt-1">Enter your OTP and new password below.</p>
                    </div>

                    <form id="reset-form" class="space-y-3.5">
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-[#526056] mb-1">Campus Email</label>
                            <input type="email" id="email" required placeholder="student@campus.edu" 
                                class="w-full px-4 py-2.5 border border-[#E8E7DF] rounded-xl text-xs bg-[#FAF9F3] text-[#111713] focus:bg-white focus:outline-none focus:border-[#004D2B] transition">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-[#526056] mb-1">OTP Code</label>
                            <input type="text" id="otp" required placeholder="Enter OTP code" 
                                class="w-full px-4 py-2.5 border border-[#E8E7DF] rounded-xl text-xs bg-[#FAF9F3] text-[#111713] focus:bg-white focus:outline-none focus:border-[#004D2B] transition">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-[#526056] mb-1">New Password</label>
                            <input type="password" id="newPassword" required placeholder="Minimum 6 characters" 
                                class="w-full px-4 py-2.5 border border-[#E8E7DF] rounded-xl text-xs bg-[#FAF9F3] text-[#111713] focus:bg-white focus:outline-none focus:border-[#004D2B] transition">
                        </div>

                        <button type="submit" id="btn-reset" 
                            class="w-full bg-[#004D2B] hover:bg-[#003B21] text-white font-extrabold py-3 px-4 rounded-xl text-xs transition active:scale-98 shadow-sm">
                            Reset Password & Log In
                        </button>
                    </form>
                </div>

                <div class="border-t border-[#E8E7DF] pt-4 flex items-center justify-between text-xs text-[#526056]">
                    <a href="login.html" class="font-extrabold text-[#004D2B] hover:underline">&larr; Back to Login</a>
                    <a href="index.html" class="text-[11px] font-semibold text-[#8A988E] hover:text-[#111713]">Guest Mode &rarr;</a>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-[#8A988E]">
        &copy; CampusStore Platform · Student Portal
    </footer>

    <!-- Application Scripts -->
    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/api.js"></script>
    <script src="../shared/js/toast.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const emailParam = urlParams.get("email");
            if (emailParam) {
                document.getElementById("email").value = emailParam;
            }
        });

        document.getElementById("reset-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const otp = document.getElementById("otp").value.trim();
            const newPassword = document.getElementById("newPassword").value.trim();
            const btn = document.getElementById("btn-reset");

            btn.disabled = true;
            btn.innerText = "Resetting...";

            const res = await window.apiFetch("/api/user/reset-password", {
                method: "POST",
                body: { email, otp, newPassword }
            });

            if (res.success) {
                window.toast.success("Password reset! Please log in.");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 800);
            } else {
                btn.disabled = false;
                btn.innerText = "Reset Password & Log In";
                window.toast.error(res.message || "Failed to reset password");
            }
        });
    </script>
</body>
</html>
