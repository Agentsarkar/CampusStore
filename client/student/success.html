<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Order Placed - CampusStore</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#004D2B',
                        'primary-dark': '#003B21',
                        surface: '#FAF9F3',
                        outline: '#E8E7DF',
                        text: '#111713',
                        subtext: '#526056'
                    },
                    boxShadow: {
                        '2xs': '0 1px 2px rgba(0,0,0,0.04)',
                        'xl-soft': '0 20px 40px -15px rgba(0,0,0,0.05)'
                    }
                }
            }
        }
    </script>
    <!-- Design System CSS -->
    <link rel="stylesheet" href="../shared/css/design-system.css">
</head>
<body class="bg-surface text-text font-sans antialiased min-h-screen flex flex-col selection:bg-primary/20">

    <!-- Header Injection Point -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <div class="w-full max-w-sm mx-auto flex flex-col items-center text-center animate-fade-in-up">
            
            <!-- Success Icon Animation -->
            <div class="relative w-24 h-24 mb-6 flex items-center justify-center rounded-full bg-emerald-50 border-4 border-white shadow-xl-soft">
                <div class="absolute inset-0 rounded-full bg-emerald-100 animate-pulse opacity-50"></div>
                <svg class="w-12 h-12 text-primary relative z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>

            <h1 class="text-2xl font-extrabold tracking-tight text-text mb-2">Order Confirmed!</h1>
            <p class="text-sm text-subtext mb-8 px-4 leading-relaxed">
                Your order is safely in our hands. We'll start processing it right away.
            </p>

            <!-- Order Receipt Card -->
            <div class="w-full bg-white border border-outline rounded-2xl p-5 mb-8 shadow-2xs text-left relative overflow-hidden">
                <!-- Decorative zig-zag top edge (receipt style) -->
                <div class="absolute top-0 left-0 right-0 h-1 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjQiPjxwb2x5Z29uIGZpbGw9IiNGQUY5RjMiIHBvaW50cz0iMCAwLCA0IDQsIDggMCIvPjwvc3ZnPg==')] bg-repeat-x opacity-40"></div>
                
                <div class="flex items-center justify-between mb-4 pb-4 border-b border-outline border-dashed">
                    <span class="text-xs font-semibold text-subtext uppercase tracking-wider">Status</span>
                    <span class="text-xs font-bold text-primary bg-primary/10 px-2.5 py-1 rounded-full">Processing</span>
                </div>
                
                <div class="flex items-center justify-between">
                    <span class="text-sm font-medium text-subtext">Payment Method</span>
                    <span class="text-sm font-bold text-text">Cash / Pickup</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="w-full flex flex-col gap-3">
                <a href="dashboard.html?tab=orders" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3.5 px-4 rounded-xl text-sm transition active:scale-[0.98] shadow-2xs flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    Track Order Status
                </a>
                
                <a href="index.html" class="w-full bg-white hover:bg-gray-50 text-text font-bold py-3.5 px-4 rounded-xl text-sm transition border border-outline active:scale-[0.98] flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-subtext" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Continue Shopping
                </a>
            </div>

        </div>
    </main>

    <!-- Footer Injection Point -->
    <div id="footer-container" class="mt-auto"></div>

    <!-- Core Scripts -->
    <script src="../shared/js/icons.js"></script>
    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/api.js"></script>
    <script src="../shared/js/toast.js"></script>
    <script src="../js/app.js"></script>
    
    <!-- Custom Page Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Optional: trigger some local confetti effect or sound if desired
        });
    </script>
</body>
</html>
