<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details — CampusStore</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Design System CSS -->
    <link rel="stylesheet" href="../shared/css/design-system.css">
</head>
<body class="bg-[#FAF9F3] text-[#111713] flex flex-col min-h-screen pb-16 sm:pb-0">

    <!-- Header Container -->
    <div id="header-container"></div>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-5" id="product-detail-container">
        <p class="text-[#526056] text-xs py-6 text-center">Loading item details...</p>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Application Scripts -->
    <script src="../shared/js/icons.js"></script>
    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/api.js"></script>
    <script src="../shared/js/toast.js"></script>
    <script src="../js/app.js"></script>
    <script src="js/token-notif.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get("id");

            window.addEventListener("productsLoaded", () => renderProductDetails(productId));
            renderProductDetails(productId);
        });

        function renderProductDetails(productId) {
            const container = document.getElementById("product-detail-container");
            if (!container) return;

            const allProds = [...(window.appState.products || []), ...(window.dummyProducts || [])];
            const product = allProds.find(p => p._id === productId);

            if (!product) {
                container.innerHTML = `
                    <div class="text-center py-10">
                        <p class="text-[#526056] text-xs">Item not found.</p>
                        <a href="index.html" class="text-[#004D2B] font-bold text-xs mt-2 inline-block hover:underline">&larr; Return to store</a>
                    </div>
                `;
                return;
            }

            const name = window.escapeHtml(product.name || 'Campus Item');
            const unit = window.escapeHtml(product.unit || (product.section === 'canteen' ? 'Serves 1' : '1 Unit'));
            const description = window.escapeHtml(product.description || 'Quality campus essential.');
            const price = Number(product.price) || 0;
            const discount = Number(product.discount) || 0;
            const discountedPrice = Math.max(0, Math.ceil(price - (price * discount) / 100));
            const isCanteen = (product.section === "canteen");

            const placeholder = window.getBrandedPlaceholderSvg(product.name);
            let rawImgUrl = (product.image && product.image.length > 0 && typeof product.image[0] === 'string' && product.image[0].trim()) 
                ? product.image[0].trim() 
                : '';
            const mainImg = rawImgUrl ? window.escapeHtml(rawImgUrl) : placeholder;

            container.innerHTML = `
                <div class="space-y-4">
                    <a href="index.html" class="text-xs font-bold text-[#004D2B] hover:underline inline-block">
                        &larr; Back to store
                    </a>

                    <div class="campus-card p-6 grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="h-64 bg-white rounded-2xl p-4 flex items-center justify-center border border-[#E8E7DF]">
                            <img src="${mainImg}" onerror="this.onerror=null; this.src='${placeholder}';" class="max-h-full max-w-full object-contain" alt="${name}">
                        </div>

                        <div class="space-y-4 flex flex-col justify-between">
                            <div class="space-y-2">
                                <span class="text-[10px] font-extrabold uppercase tracking-wider text-[#004D2B]">
                                    ${isCanteen ? 'Campus Canteen' : 'Campus Flash'}
                                </span>
                                <h1 class="text-lg font-extrabold text-[#111713]">${name}</h1>
                                <p class="text-xs text-[#526056] font-medium">${unit}</p>
                                <p class="text-xs text-[#526056] leading-relaxed">${description}</p>
                            </div>

                            <div class="border-t border-[#E8E7DF] pt-4 space-y-3">
                                <div class="flex items-baseline gap-2">
                                    <span class="text-2xl font-extrabold text-[#111713]">₹${discountedPrice}</span>
                                    ${discount > 0 ? `<span class="text-xs text-[#8A988E] line-through">₹${price}</span>` : ""}
                                </div>

                                <button onclick="window.addToCart('${window.escapeHtml(product._id)}')" class="w-full bg-[#004D2B] hover:bg-[#003B21] text-white font-bold py-2.5 px-4 rounded-xl text-xs transition shadow-2xs active:scale-98">
                                    Add to Basket
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
