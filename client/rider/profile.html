<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - Campus Rider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F4F3EB; -webkit-tap-highlight-color: transparent; }
        .campus-card { background: #FFFFFF; border: 1px solid #E8E7DF; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border-radius: 20px; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-[#111713]">
    <header class="bg-white border-b border-[#E8E7DF] sticky top-0 z-50">
        <div class="max-w-md w-full mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="window.location.href='index.html'" class="w-10 h-10 bg-[#FAF9F3] text-[#526056] rounded-xl flex items-center justify-center font-bold">
                ←
            </button>
            <h1 class="text-sm font-black tracking-tight text-[#111713]">Rider Profile</h1>
            <div class="w-10"></div>
        </div>
    </header>

    <main class="flex-grow max-w-md w-full mx-auto px-4 py-5 space-y-4">
        <div class="campus-card p-5 space-y-4">
            <div class="flex items-center gap-3 border-b border-[#E8E7DF] pb-4">
                <div class="w-12 h-12 rounded-full bg-[#E6F0EB] text-[#004D2B] flex items-center justify-center font-bold text-xl uppercase" id="profile-initial">
                    R
                </div>
                <div>
                    <h2 class="text-base font-extrabold text-[#111713]" id="profile-name">Loading...</h2>
                    <p class="text-xs text-[#526056]" id="profile-email">loading@email.com</p>
                </div>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-[10px] font-extrabold uppercase text-[#8A988E] tracking-wider block mb-1">Roll Number</label>
                    <div class="w-full bg-[#FAF9F3] border border-[#E8E7DF] rounded-xl px-4 py-2.5 text-sm font-bold text-[#526056]" id="profile-roll">Loading...</div>
                </div>
                <div>
                    <label class="text-[10px] font-extrabold uppercase text-[#8A988E] tracking-wider block mb-1">Contact Number (Editable)</label>
                    <input type="tel" id="profile-phone" class="w-full bg-white border border-[#E8E7DF] focus:border-[#004D2B] focus:ring-1 focus:ring-[#004D2B] outline-none rounded-xl px-4 py-2.5 text-sm font-bold transition-all" placeholder="Enter phone number">
                </div>
            </div>

            <button type="button" onclick="updateProfile()" id="update-btn" class="w-full py-3 bg-[#004D2B] hover:bg-[#003B21] text-white font-extrabold text-sm rounded-xl shadow-md transition active:scale-[0.99] mt-2">
                Update Profile
            </button>
        </div>
    </main>

    <script src="js/rider.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!localStorage.getItem('campus_rider_access_token')) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await window.riderApiFetch('/api/rider/profile', { headers: getAuthHeaders() });
                if (res && res.success) {
                    const r = res.data;
                    document.getElementById('profile-initial').textContent = r.name ? r.name.charAt(0) : 'R';
                    document.getElementById('profile-name').textContent = r.name;
                    document.getElementById('profile-email').textContent = r.email;
                    document.getElementById('profile-roll').textContent = r.roll_number;
                    document.getElementById('profile-phone').value = r.phone;
                }
            } catch (err) {
                console.error(err);
                alert("Failed to load profile.");
            }
        });

        async function updateProfile() {
            const phone = document.getElementById('profile-phone').value;
            const btn = document.getElementById('update-btn');
            
            if (!phone) return alert("Phone number is required");

            btn.textContent = "Updating...";
            btn.disabled = true;

            try {
                const res = await window.riderApiFetch('/api/rider/profile', {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ phone })
                });

                if (res && res.success) {
                    alert("Profile updated successfully!");
                } else {
                    alert("Update failed: " + (res.detail || res.message));
                }
            } catch (err) {
                console.error(err);
                alert("An error occurred");
            } finally {
                btn.textContent = "Update Profile";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
