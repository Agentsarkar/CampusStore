<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Order History - Campus Rider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F4F3EB; -webkit-tap-highlight-color: transparent; }
        .campus-card { background: #FFFFFF; border: 1px solid #E8E7DF; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border-radius: 20px; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-[#111713]">
    <header class="bg-white border-b border-[#E8E7DF] sticky top-0 z-50">
        <div class="max-w-md w-full mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="window.location.href='index.html'" class="w-10 h-10 bg-[#FAF9F3] text-[#526056] rounded-xl flex items-center justify-center font-bold">
                ←
            </button>
            <h1 class="text-sm font-black tracking-tight text-[#111713]">Order History</h1>
            <div class="w-10"></div>
        </div>
    </header>

    <main class="flex-grow max-w-md w-full mx-auto px-4 py-5 space-y-4">
        <div id="loading-indicator" class="text-center py-10 text-sm font-bold text-[#8A988E]">
            Loading past orders...
        </div>
        
        <div id="empty-state" class="hidden text-center py-12">
            <div class="text-4xl mb-4">📭</div>
            <h3 class="text-base font-extrabold text-[#111713]">No orders yet</h3>
            <p class="text-xs text-[#526056] mt-1">Complete your first delivery to see it here.</p>
        </div>

        <div id="history-list" class="space-y-3 hidden">
            <!-- Populated via JS -->
        </div>
    </main>

    <script src="js/rider.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!localStorage.getItem('campus_rider_access_token')) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await window.riderApiFetch('/api/rider/history', { headers: getAuthHeaders() });
                document.getElementById('loading-indicator').classList.add('hidden');
                
                if (res && res.success && res.data && res.data.length > 0) {
                    const listEl = document.getElementById('history-list');
                    listEl.classList.remove('hidden');
                    
                    listEl.innerHTML = res.data.map(order => {
                        return `
                        <div class="campus-card p-4 hover:border-[#004D2B] transition">
                            <div class="flex justify-between items-start border-b border-[#E8E7DF] pb-2 mb-2">
                                <div>
                                    <span class="text-[10px] font-extrabold uppercase text-[#8A988E] tracking-wider">Order ID</span>
                                    <h4 class="text-sm font-black text-[#111713]">${order.id.split('-')[0] + '...' || order.id}</h4>
                                </div>
                                <div class="text-right">
                                    <span class="text-[10px] font-extrabold uppercase text-[#8A988E] tracking-wider">Earned</span>
                                    <span class="block text-sm font-black text-[#004D2B]">₹20</span>
                                </div>
                            </div>
                            <div class="space-y-1 text-xs">
                                <div class="flex items-start gap-2">
                                    <span class="text-[#8A988E] w-12 flex-shrink-0">From:</span>
                                    <span class="font-bold text-[#111713] truncate">${order.store_name || 'Campus Outlet'}</span>
                                </div>
                                <div class="flex items-start gap-2">
                                    <span class="text-[#8A988E] w-12 flex-shrink-0">To:</span>
                                    <span class="font-bold text-[#111713] truncate">${order.delivery_address || 'Campus Location'}</span>
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('');
                } else {
                    document.getElementById('empty-state').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loading-indicator').textContent = "Failed to load history.";
            }
        });
    </script>
</body>
</html>
