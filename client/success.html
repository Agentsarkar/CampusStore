<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed - Campus Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen">

    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Container -->
    <main class="flex-grow flex items-center justify-center py-16 px-4">
        <div class="bg-slate-900 p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-slate-800 text-center space-y-6">
            
            <!-- Success Icon -->
            <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-2xl flex items-center justify-center mx-auto shadow-inner animate-pulse">
                <i class="fa-solid fa-circle-check text-4xl"></i>
            </div>

            <div>
                <span class="text-3xs font-black uppercase px-2.5 py-1 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800">Order Confirmed</span>
                <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight mt-2">Order Confirmed!</h1>
                <p class="text-slate-400 text-xs mt-2 leading-relaxed">
                    Thank you! Your order has been dispatched. Hostel items will arrive in 8 mins, and canteen food counter token is generated below.
                </p>
            </div>

            <!-- Digital Token Display -->
            <div class="bg-slate-950 border border-slate-800 p-5 rounded-2xl">
                <span class="text-3xs font-black uppercase text-slate-400 tracking-wider">Digital Counter Token</span>
                <div class="text-3xl font-black text-amber-400 font-mono mt-1" id="digital-token-id">#C-109</div>
                <p class="text-[11px] text-slate-400 mt-1">Show this token at Counter 2 (Main Canteen) for instant pickup</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <a href="index.html" 
                    class="flex-1 bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-600 hover:to-emerald-600 text-slate-950 font-black py-3 px-4 rounded-xl shadow-lg transition text-xs">
                    <i class="fa-solid fa-store mr-1"></i> Continue Shopping
                </a>
            </div>

        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const randomToken = "TOKEN #C-" + Math.floor(100 + Math.random() * 900);
            const tokenEl = document.getElementById("digital-token-id");
            if (tokenEl) tokenEl.innerText = randomToken;
        });
    </script>
</body>
</html>
