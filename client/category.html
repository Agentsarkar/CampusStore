<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Browser - Campus Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        html.light body { background-color: #f8fafc !important; color: #0f172a !important; }
        html.light .bg-slate-900 { background-color: #ffffff !important; border-color: #e2e8f0 !important; }
        html.light .bg-slate-950 { background-color: #f8fafc !important; }
        html.light .text-white { color: #0f172a !important; }
        html.light .card-box { background-color: #ffffff !important; color: #0f172a !important; border-color: #e2e8f0 !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen">

    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Category Browser Layout -->
    <main class="flex-grow container mx-auto px-4 py-8 flex flex-col md:flex-row gap-6">
        
        <!-- Sidebar: Categories list -->
        <aside class="w-full md:w-72 flex-shrink-0 bg-slate-900 rounded-2xl border border-slate-800 p-4 h-fit sticky top-28 shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                <h3 class="font-black text-white text-base flex items-center gap-2">
                    <i class="fa-solid fa-list-ul text-cyan-400"></i> Categories
                </h3>
                <span id="sidebar-store-tag" class="text-3xs font-black uppercase px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">
                    Flash ⚡
                </span>
            </div>

            <div id="sidebar-categories" class="flex md:flex-col gap-2 overflow-x-auto no-scrollbar md:overflow-x-visible">
                <!-- Dynamic Sidebar Categories -->
                <div class="h-10 bg-slate-800/60 animate-pulse rounded-xl"></div>
            </div>
        </aside>

        <!-- Right Content: Products Grid -->
        <section class="flex-grow">
            <!-- Category Header -->
            <div class="mb-6 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl flex justify-between items-center">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span id="active-sec-badge" class="text-3xs font-black uppercase px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">
                            Hostel Express (8 Mins)
                        </span>
                    </div>
                    <h2 class="text-2xl font-black text-white" id="category-title">Loading Category...</h2>
                    <p class="text-slate-400 text-xs mt-1" id="category-desc">Exploring campus essentials</p>
                </div>
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 border border-slate-700">
                    <i class="fa-solid fa-arrow-left text-2xs"></i> Home
                </a>
            </div>

            <!-- Products Grid -->
            <div id="category-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Loading Skeletons -->
                <div class="h-64 bg-slate-900 border border-slate-800 rounded-2xl animate-pulse"></div>
                <div class="h-64 bg-slate-900 border border-slate-800 rounded-2xl animate-pulse"></div>
            </div>

            <!-- Empty category prompt -->
            <div id="empty-category-ui" class="hidden flex flex-col items-center justify-center py-20 bg-slate-900/60 rounded-3xl border border-slate-800 text-slate-400">
                <i class="fa-solid fa-basket-shopping text-6xl mb-4 text-slate-700"></i>
                <p class="text-lg font-bold text-slate-300">No products in this category yet</p>
                <p class="text-xs text-slate-400 mt-1">Check back soon for fresh arrivals!</p>
            </div>
        </section>

    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Shared Scripts -->
    <script src="js/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let activeCategoryId = urlParams.get("id");
        let activeCategoryName = urlParams.get("name") || "Category";
        let activeSection = urlParams.get("section") || "flash";

        document.addEventListener("DOMContentLoaded", () => {
            updateCategoryHeader();
        });

        window.addEventListener("categoriesLoaded", () => {
            renderSidebar();
            fetchProductsForActiveCategory();
        });

        function updateCategoryHeader() {
            document.getElementById("category-title").innerText = activeCategoryName;
            document.title = `${activeCategoryName} - Campus Store`;

            const badge = document.getElementById("active-sec-badge");
            const sideTag = document.getElementById("sidebar-store-tag");
            if (activeSection === "canteen") {
                badge.innerText = "Canteen Special (Hot Meal Counter)";
                badge.className = "text-3xs font-black uppercase px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-800";
                sideTag.innerText = "Canteen 🍳";
                sideTag.className = "text-3xs font-black uppercase px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-800";
            } else {
                badge.innerText = "Hostel Express (8 Mins)";
                badge.className = "text-3xs font-black uppercase px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800";
                sideTag.innerText = "Flash ⚡";
                sideTag.className = "text-3xs font-black uppercase px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800";
            }
        }

        function renderSidebar() {
            const sidebar = document.getElementById("sidebar-categories");
            const categories = window.appState.categories.length > 0 ? window.appState.categories : window.dummyCategories;
            
            if (categories.length === 0) return;

            // Pick first category if none active
            if (!activeCategoryId) {
                activeCategoryId = categories[0]._id;
                activeCategoryName = categories[0].name;
                activeSection = categories[0].section || "flash";
                updateCategoryHeader();
            }

            sidebar.innerHTML = "";
            categories.forEach(cat => {
                const isActive = cat._id === activeCategoryId;
                const isCanteenCat = (cat.section === "canteen");
                
                const link = document.createElement("a");
                link.href = `category.html?id=${cat._id}&name=${encodeURIComponent(cat.name)}&section=${cat.section || 'flash'}`;
                
                let activeStyle = "";
                if (isActive) {
                    activeStyle = isCanteenCat 
                        ? "bg-amber-500/20 border-amber-500/50 text-amber-300 font-extrabold shadow-lg shadow-amber-500/10" 
                        : "bg-cyan-500/20 border-cyan-500/50 text-cyan-300 font-extrabold shadow-lg shadow-cyan-500/10";
                } else {
                    activeStyle = "bg-slate-950/60 border-slate-800/80 text-slate-300 hover:bg-slate-800 hover:text-white";
                }

                link.className = `flex-shrink-0 flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs transition-all border ${activeStyle}`;
                link.innerHTML = `
                    <img src="${cat.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100'}" class="w-6 h-6 object-cover rounded-lg">
                    <span class="line-clamp-1">${cat.name}</span>
                `;
                sidebar.appendChild(link);
            });
        }

        async function fetchProductsForActiveCategory() {
            const grid = document.getElementById("category-grid");
            const emptyUi = document.getElementById("empty-category-ui");
            const desc = document.getElementById("category-desc");

            let matchedProducts = [];

            // Try backend API first
            const res = await apiFetch("/api/product/get-product-by-category", {
                method: "POST",
                body: { id: activeCategoryId }
            });

            if (res.success && res.data && res.data.length > 0) {
                matchedProducts = res.data;
            } else {
                // Fallback to local dummy engine products matching category
                const dummyProds = window.dummyProducts;
                matchedProducts = dummyProds.filter(p => p.category_id === activeCategoryId);
            }

            if (matchedProducts.length > 0) {
                grid.classList.remove("hidden");
                emptyUi.classList.add("hidden");
                grid.innerHTML = "";
                
                matchedProducts.forEach(product => {
                    grid.innerHTML += window.renderProductCardHtml(product);
                });
                desc.innerText = `${matchedProducts.length} items available in this category`;
            } else {
                grid.classList.add("hidden");
                emptyUi.classList.remove("hidden");
                desc.innerText = `0 items available`;
            }
        }

        // Cart Sync
        window.addEventListener("cartUpdated", () => {
            if (activeCategoryId) {
                fetchProductsForActiveCategory();
            }
        });
    </script>
</body>
</html>
