<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Campus Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        html.light body { background-color: #f8fafc !important; color: #0f172a !important; }
        html.light .bg-slate-900 { background-color: #ffffff !important; border-color: #e2e8f0 !important; }
        html.light .bg-slate-950 { background-color: #f8fafc !important; }
        html.light .text-white { color: #0f172a !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen">

    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Product Details Content -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
        
        <!-- Back button -->
        <div class="mb-6">
            <a href="index.html" class="bg-slate-900 hover:bg-slate-800 text-slate-300 font-bold text-xs px-4 py-2 rounded-xl transition inline-flex items-center gap-2 border border-slate-800">
                <i class="fa-solid fa-arrow-left"></i> Back to Campus Portal
            </a>
        </div>

        <!-- Product Card Container -->
        <div class="bg-slate-900 rounded-3xl border border-slate-800 p-6 md:p-10 flex flex-col md:flex-row gap-8 lg:gap-12 shadow-2xl" id="product-details-card">
            <!-- Loading Skeleton -->
            <div class="w-full md:w-1/2 aspect-square bg-slate-950 animate-pulse rounded-2xl"></div>
            <div class="flex-grow space-y-4 animate-pulse">
                <div class="h-8 bg-slate-800 w-3/4 rounded-xl"></div>
                <div class="h-4 bg-slate-800 w-1/4 rounded-lg"></div>
                <div class="h-12 bg-slate-800 w-1/3 rounded-xl"></div>
            </div>
        </div>

    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Shared Scripts -->
    <script src="js/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get("id");

        document.addEventListener("DOMContentLoaded", () => {
            if (productId) {
                fetchProductDetails();
            } else {
                window.location.href = "index.html";
            }
        });

        async function fetchProductDetails() {
            const card = document.getElementById("product-details-card");
            let product = null;

            // Attempt API fetch
            const res = await apiFetch("/api/product/get-product-details", {
                method: "POST",
                body: { productId }
            });

            if (res.success && res.data) {
                product = res.data;
            } else {
                // Fallback to local dummy dataset
                product = window.dummyProducts.find(p => p._id === productId);
            }

            if (!product) {
                card.innerHTML = `<p class="text-slate-400 py-12 text-center w-full">Product not found.</p>`;
                return;
            }

            document.title = `${product.name} - Campus Store`;

            const price = product.price || 0;
            const discount = product.discount || 0;
            const discountedPrice = Math.max(0, price - Math.ceil((price * discount) / 100));
            const hasDiscount = discount > 0;
            const isCanteen = (product.section === "canteen");

            // Cart state
            const cartItem = window.appState.cart.find(item => item.productId && (item.productId._id === product._id || item.productId === product._id));
            const inCart = !!cartItem;
            const qty = inCart ? cartItem.quantity : 0;
            const cartId = inCart ? cartItem._id : "";

            let actionBtnHtml = "";
            if (product.stock === 0) {
                actionBtnHtml = `<span class="bg-rose-500/10 border border-rose-500/30 text-rose-400 font-bold px-6 py-3 rounded-xl text-sm">Out of Stock</span>`;
            } else if (inCart) {
                actionBtnHtml = `
                    <div class="flex items-center border border-slate-700 rounded-xl ${isCanteen ? 'bg-amber-600' : 'bg-cyan-600'} text-white font-bold w-36 shadow-lg">
                        <button onclick="updateCartQty('${cartId}', ${qty - 1})" class="px-3.5 py-2.5 hover:opacity-80 transition flex-1 text-center">
                            <i class="fa-solid fa-minus text-xs"></i>
                        </button>
                        <span class="px-4 text-sm font-black flex-1 text-center select-none">${qty}</span>
                        <button onclick="updateCartQty('${cartId}', ${qty + 1})" class="px-3.5 py-2.5 hover:opacity-80 transition flex-1 text-center">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                    </div>
                `;
            } else {
                if (isCanteen) {
                    actionBtnHtml = `
                        <button onclick="addToCart('${product._id}')" 
                            class="bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-slate-950 font-black py-3 px-8 rounded-xl shadow-xl shadow-orange-500/20 transition duration-200 text-sm flex items-center gap-2 active:scale-95">
                            <i class="fa-solid fa-utensils"></i> Add to Canteen Basket
                        </button>
                    `;
                } else {
                    actionBtnHtml = `
                        <button onclick="addToCart('${product._id}')" 
                            class="bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-600 hover:to-emerald-600 text-slate-950 font-black py-3 px-8 rounded-xl shadow-xl shadow-cyan-500/20 transition duration-200 text-sm flex items-center gap-2 active:scale-95">
                            <i class="fa-solid fa-bolt"></i> Add to Hostel Basket
                        </button>
                    `;
                }
            }

            const mainImg = (product.image && product.image.length > 0) ? product.image[0] : "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400";

            card.innerHTML = `
                <!-- Left: Product Image -->
                <div class="w-full md:w-1/2 aspect-square flex items-center justify-center bg-slate-950 rounded-2xl p-6 border border-slate-800">
                    <img src="${mainImg}" class="max-h-full max-w-full object-contain transition-transform duration-500 hover:scale-105" alt="${product.name}">
                </div>
                
                <!-- Right: Details -->
                <div class="flex-grow flex flex-col justify-between py-2">
                    <div>
                        <!-- Badges -->
                        <div class="flex flex-wrap items-center gap-2 mb-3">
                            ${isCanteen ? `
                                <span class="bg-amber-950 border border-amber-800 text-amber-400 font-extrabold text-xs px-3 py-1 rounded-full flex items-center gap-1">
                                    <i class="fa-solid fa-utensils"></i> Canteen Counter (${product.prep_time || '10 mins prep'})
                                </span>
                            ` : `
                                <span class="bg-cyan-950 border border-cyan-800 text-cyan-400 font-extrabold text-xs px-3 py-1 rounded-full flex items-center gap-1">
                                    <i class="fa-solid fa-bolt text-emerald-400"></i> 8-Min Hostel Express
                                </span>
                            `}
                            ${hasDiscount ? `<span class="bg-rose-600 text-white font-black text-xs px-3 py-1 rounded-full shadow-md">${discount}% OFF</span>` : ""}
                        </div>
                        
                        <!-- Title -->
                        <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight leading-tight">${product.name}</h1>
                        <p class="text-xs text-slate-400 font-bold uppercase mt-2 tracking-wider">${product.unit || '1 unit'}</p>
                        
                        <!-- Pricing -->
                        <div class="flex items-baseline gap-3 my-6">
                            <span class="text-3xl font-black text-white">₹${discountedPrice}</span>
                            ${hasDiscount ? `<span class="text-base text-slate-500 line-through">₹${price}</span>` : ""}
                        </div>

                        <!-- Description -->
                        <div class="border-t border-slate-800 pt-4 my-4">
                            <h4 class="text-xs font-black uppercase text-slate-400 tracking-wider mb-2">Item Details</h4>
                            <p class="text-slate-300 text-xs md:text-sm leading-relaxed">${product.description || 'Fresh campus product ready for instant delivery or pickup.'}</p>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <div class="pt-6 border-t border-slate-800 flex items-center gap-4">
                        ${actionBtnHtml}
                    </div>
                </div>
            `;
        }

        // Cart Sync
        window.addEventListener("cartUpdated", () => {
            if (productId) fetchProductDetails();
        });
    </script>
</body>
</html>
